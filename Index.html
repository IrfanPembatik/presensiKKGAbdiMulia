<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Pertemuan Rutin KKG Gugus 1 Abdi Mulia</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="py-8 px-4 sm:px-6 lg:px-8 flex items-center justify-center">

    <div class="max-w-xl w-full space-y-6">
        <!-- Card Container -->
        <div class="glass-card rounded-3xl shadow-2xl overflow-hidden border border-gray-100 transition-all duration-300">
            
            <!-- Header Section -->
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 px-6 py-8 text-center text-white relative">
                <!-- Decorative pattern background -->
                <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>
                
                <div class="relative z-10 flex flex-col items-center">
                    <!-- Logo Header -->
                    <div class="w-24 h-24 bg-white p-2 rounded-2xl shadow-lg mb-4 flex items-center justify-center transform hover:scale-105 transition-transform duration-300">
                        <img src="https://iili.io/CHCMc1S.md.png" alt="Logo KKG" class="max-h-full max-w-full object-contain" onerror="this.onerror=null; this.src='https://placehold.co/150?text=KKG+GUGUS+1'">
                    </div>
                    <!-- Judul Header -->
                    <h1 class="text-lg sm:text-xl font-extrabold tracking-wide uppercase leading-tight drop-shadow-sm">
                        Presensi Pertemuan Rutin
                    </h1>
                    <p class="text-xs sm:text-sm font-semibold text-blue-100 mt-1 uppercase tracking-wider">
                        KKG Gugus 1 Abdi Mulia
                    </p>
                </div>
            </div>

            <!-- Form Content -->
            <form id="attendanceForm" class="p-6 sm:p-8 space-y-5" onsubmit="handleSubmit(event)">
                
                <!-- Email Input -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Alamat Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" name="email" required placeholder="nama@email.com"
                            class="pl-10 w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none text-gray-800 text-sm">
                    </div>
                </div>

                <!-- Nama Lengkap Input -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Nama Lengkap (Serta Gelar)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-regular fa-user"></i>
                        </span>
                        <input type="text" name="nama" required placeholder="Masukkan nama lengkap Anda"
                            class="pl-10 w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none text-gray-800 text-sm">
                    </div>
                </div>

                <!-- Unit Kerja Dropdown -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Unit Kerja</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-school"></i>
                        </span>
                        <select name="unit_kerja" required
                            class="pl-10 w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none text-gray-800 text-sm appearance-none cursor-pointer">
                            <option value="" disabled selected>Pilih Unit Kerja Anda...</option>
                            <option value="SD Negeri Kajulangko">SD Negeri Kajulangko</option>
                            <option value="SD Negeri 1 Pusungi">SD Negeri 1 Pusungi</option>
                            <option value="SD Negeri 2 Pusungi">SD Negeri 2 Pusungi</option>
                            <option value="SD Negeri 3 Pusungi">SD Negeri 3 Pusungi</option>
                            <option value="SD Negeri 4 Pusungi">SD Negeri 4 Pusungi</option>
                            <option value="SD Negeri Tete A">SD Negeri Tete A</option>
                            <option value="SD Negeri Tete B">SD Negeri Tete B</option>
                            <option value="SD Negeri 1 Uebone">SD Negeri 1 Uebone</option>
                            <option value="SD Negeri 2 Uebone">SD Negeri 2 Uebone</option>
                            <option value="SD Negeri Mantangisi">SD Negeri Mantangisi</option>
                        </select>
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </span>
                    </div>
                </div>

                <!-- Jabatan Dropdown -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Jabatan</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-briefcase"></i>
                        </span>
                        <select name="jabatan" required
                            class="pl-10 w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none text-gray-800 text-sm appearance-none cursor-pointer">
                            <option value="" disabled selected>Pilih Jabatan Anda...</option>
                            <option value="Pengawas Sekolah">Pengawas Sekolah</option>
                            <option value="Korwil">Korwil</option>
                            <option value="Kepala Sekolah">Kepala Sekolah</option>
                            <option value="Kepala Sekolah (Mewakili)">Kepala Sekolah (Mewakili)</option>
                            <option value="Guru Kelas">Guru Kelas</option>
                            <option value="Guru Mapel">Guru Mapel</option>
                        </select>
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </span>
                    </div>
                </div>

                <!-- Peran Dropdown -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Peran Dalam Kegiatan</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-id-card-clip"></i>
                        </span>
                        <select name="peran" required
                            class="pl-10 w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none text-gray-800 text-sm appearance-none cursor-pointer">
                            <option value="" disabled selected>Pilih Peran Anda...</option>
                            <option value="Peserta">Peserta</option>
                            <option value="Fasilitator">Fasilitator</option>
                            <option value="Panitia">Panitia</option>
                            <option value="Undangan">Undangan</option>
                        </select>
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </span>
                    </div>
                </div>

                <!-- No HP / WA -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Nomor HP/WA Aktif</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-brands fa-whatsapp"></i>
                        </span>
                        <input type="tel" name="no_hp" required placeholder="Contoh: 081234567xxx"
                            class="pl-10 w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none text-gray-800 text-sm">
                    </div>
                </div>

                <!-- Signature Pad -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Tanda Tangan Digital</label>
                        <button type="button" onclick="clearSignature()" class="text-xs text-red-500 hover:text-red-600 font-semibold focus:outline-none flex items-center gap-1">
                            <i class="fa-solid fa-eraser"></i> Bersihkan
                        </button>
                    </div>
                    <div class="border-2 border-dashed border-gray-200 rounded-2xl bg-gray-50 overflow-hidden relative">
                        <canvas id="signatureCanvas" class="w-full h-44 cursor-crosshair touch-none block"></canvas>
                        <div id="signaturePlaceholder" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-signature text-3xl mb-1"></i>
                            <span class="text-xs">Goreskan tanda tangan Anda di sini</span>
                        </div>
                    </div>
                </div>

                <!-- Action Button -->
                <div class="pt-2">
                    <button type="submit" id="submitBtn"
                        class="w-full py-3 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-blue-200 hover:shadow-xl transition-all duration-200 focus:ring-4 focus:ring-blue-100 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Kirim Presensi
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer Info -->
        <p class="text-center text-xs text-gray-400 font-medium">
            &copy; 2026 KKG Gugus 1 Abdi Mulia. All Rights Reserved.
        </p>
    </div>

    <!-- Modal Success/Error Message -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl text-center transform scale-95 transition-transform duration-300 flex flex-col items-center">
            <div id="modalIcon" class="w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-4"></div>
            <h3 id="modalTitle" class="text-lg font-bold text-gray-800 mb-2"></h3>
            <p id="modalDesc" class="text-sm text-gray-500 mb-6"></p>
            <button onclick="closeModal()" id="modalCloseBtn" class="w-full py-2.5 px-5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition-colors">
                Tutup
            </button>
        </div>
    </div>

    <!-- Script Handling -->
    <script>
        // Web App URL dari Google Apps Script - Harap ganti setelah Deploy!
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyNXj0Yquu38wMWKO-G31CQV10p6SbvcM16oFNZoT6nrze2jQ5dsrDRfzsHct3FHHI7/exec"; 

        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('signaturePlaceholder');
        const modal = document.getElementById('modal');
        const submitBtn = document.getElementById('submitBtn');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let hasSigned = false;

        // Setup Canvas Resolution (Handling Retina/HD displays)
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            // Set styles for drawing
            ctx.strokeStyle = '#1e1b4b'; // Indigo 950
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // If it had a drawing, resizing clears it. So we prompt clear state.
            if (hasSigned) {
                clearSignature();
            }
        }

        // Initialize Canvas
        window.addEventListener('load', () => {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        });

        // Drawing Event Listeners (Mouse)
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            [lastX, lastY] = getCoordinates(e);
            placeholder.classList.add('hidden');
            hasSigned = true;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            draw(e);
        });

        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        // Drawing Event Listeners (Touch)
        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            const touch = e.touches[0];
            [lastX, lastY] = getCoordinates(touch);
            placeholder.classList.add('hidden');
            hasSigned = true;
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const touch = e.touches[0];
            draw(touch);
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', () => isDrawing = false);

        function getCoordinates(event) {
            const rect = canvas.getBoundingClientRect();
            const clientX = event.clientX;
            const clientY = event.clientY;
            return [
                clientX - rect.left,
                clientY - rect.top
            ];
        }

        function draw(e) {
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            const [currentX, currentY] = getCoordinates(e);
            ctx.lineTo(currentX, currentY);
            ctx.stroke();
            [lastX, lastY] = [currentX, currentY];
        }

        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            placeholder.classList.remove('hidden');
            hasSigned = false;
        }

        // Custom Modal Alert Control
        function showAlert(type, title, desc) {
            const modalIcon = document.getElementById('modalIcon');
            const modalTitle = document.getElementById('modalTitle');
            const modalDesc = document.getElementById('modalDesc');
            const closeBtn = document.getElementById('modalCloseBtn');

            if (type === 'success') {
                modalIcon.className = "w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-4 bg-green-100 text-green-600";
                modalIcon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                closeBtn.className = "w-full py-2.5 px-5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl transition-colors";
            } else {
                modalIcon.className = "w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-4 bg-red-100 text-red-600";
                modalIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
                closeBtn.className = "w-full py-2.5 px-5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition-colors";
            }

            modalTitle.innerText = title;
            modalDesc.innerText = desc;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.children[0].classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modal.children[0].classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Form Submit Handling
        async function handleSubmit(event) {
            event.preventDefault();

            if (SCRIPT_URL === "URL_APPS_SCRIPT_ANDA") {
                showAlert('error', 'Konfigurasi Belum Selesai', 'Anda harus memasukkan URL Google Apps Script yang sudah dideploy ke dalam variabel SCRIPT_URL di dalam kode file Index.html terlebih dahulu.');
                return;
            }

            if (!hasSigned) {
                showAlert('error', 'Tanda Tangan Diperlukan', 'Harap isi bagian tanda tangan digital terlebih dahulu sebelum mengirim.');
                return;
            }

            // Set Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> Mengirim Data...';

            const form = event.target;
            const formData = new FormData(form);
            
            // Konversi gambar tanda tangan (Canvas) ke base64 (PNG)
            const signatureDataUrl = canvas.toDataURL('image/png');
            formData.append('tanda_tangan', signatureDataUrl);

            // Convert form data to standard JSON object
            const formObject = {};
            formData.forEach((value, key) => {
                formObject[key] = value;
            });

            // Kirim data ke Google Apps Script menggunakan fetch API
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Diperlukan untuk CORS bypass Apps Script
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formObject)
                });

                // Dikarenakan 'no-cors', browser tidak bisa membaca respons body (selalu tipe opaque).
                // Maka dari itu kita anggap sukses jika tidak masuk blok catch.
                showAlert('success', 'Presensi Berhasil!', 'Terima kasih, data kehadiran Anda telah tersimpan dengan aman di database.');
                form.reset();
                clearSignature();

            } catch (error) {
                console.error("Error submitting form:", error);
                showAlert('error', 'Gagal Mengirim', 'Terjadi kesalahan saat menghubungkan ke server. Silakan coba kembali.');
            } finally {
                // Reset Button state
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Presensi';
            }
        }
    </script>
</body>
</html>
